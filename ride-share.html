<style>
:root { --brand:#118A50; --ink:#12201f; --muted:#5f6b6a; --line:#dfe6e5;
        --bg:#f4f8f7; --card:#ffffff; --warn:#8a5a00; --warnbg:#fff6e5; }
* { box-sizing: border-box; }
body {
  margin:0 auto; padding:18px 14px 48px; max-width:560px; background:var(--bg); color:var(--ink);
  font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", "Traditional Arabic", system-ui, sans-serif;

}
header.site { padding-bottom:12px; margin-bottom:16px; border-bottom:2px solid var(--brand); }
header.site .name { font-weight:700; color:var(--brand); font-size:19px; }
.card {
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:18px 16px; box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.card + .card { margin-top:14px; }
h1 { font-size:22px; line-height:1.5; margin:0 0 4px; color:var(--brand); }
h2 { font-size:20px; margin:0 0 8px; color:var(--brand); }
p { margin:10px 0; }
.muted { color:var(--muted); font-size:15px; }
.big { font-size:19px; font-weight:700; }
.status {
  display:inline-block; background:var(--brand); color:#fff; font-weight:700;
  padding:6px 14px; border-radius:999px; font-size:16px; margin-bottom:14px;
}
.status.off { background:var(--muted); }
.kv { display:flex; gap:10px; margin:6px 0; font-size:17px; }
.kv .k { color:var(--muted); min-width:74px; }
.kv .v { font-weight:700; }
.map {
  position:relative; height:280px; margin:14px 0 6px; border-radius:14px;
  overflow:hidden; background:#e8edec; border:1px solid var(--line);
}
.map img { position:absolute; width:256px; height:256px; max-width:none; user-select:none; }
/* مسار الرحلة — طبقة SVG فوق البلاطات.
   ⚠️ `pointer-events:none` عشان الخط ما يمنعش السحب/الدوس على الخريطة،
   و`overflow` من `.map` هو اللي بيقص الخط لو طلع بره.
   والخط بيترسم **مرتين**: طبقة بيضا عريضة تحت (كيسنج) وطبقة بلون الهوية فوق —
   من غير الكيسنج الخط بيختفي على البلاطات الفاتحة (شوارع الرمل والشوارع
   البيضا) والكابتن يبان ماشي في الفراغ. */
.map svg.trail { position:absolute; left:0; top:0; pointer-events:none; }
.map svg.trail polyline { fill:none; stroke-linecap:round; stroke-linejoin:round; }
.map svg.trail polyline.casing { stroke:#ffffff; stroke-opacity:.85; stroke-width:9; }
.map svg.trail polyline.line { stroke:var(--brand); stroke-opacity:.95; stroke-width:5; }
.map .pin {
  /* ⚠️ `left/top` دول **قيمة احتياطية بس** — الـ JS بتحسب مكان الكابتن على
     الخريطة وتحطها inline (شوف `drawMap`)، لأن مركز الخريطة بقى منتصف
     المسار مش مكان العربية. لو الحساب ما اشتغلش لأي سبب، الماركر يقف في
     النص (سلوك النسخة القديمة) أحسن من ما يختفي. */
  position:absolute; left:50%; top:50%; width:20px; height:20px; margin:-10px 0 0 -10px;
  border-radius:50%; background:var(--brand); border:4px solid #fff;
  box-shadow:0 1px 6px rgba(0,0,0,.35);
}
.map .osm {
  position:absolute; inset-inline-end:6px; bottom:4px; background:rgba(255,255,255,.88);
  font-size:12px; padding:1px 6px; border-radius:6px;
}
.map .osm a { color:#4a5a58; text-decoration:none; }
.btn {
  display:block; text-align:center; text-decoration:none; margin-top:14px;
  background:var(--brand); color:#fff; font-weight:700; font-size:17px;
  padding:13px 16px; border-radius:12px;
}
.btn.ghost { background:transparent; color:var(--brand); border:2px solid var(--brand); }
.warn {
  background:var(--warnbg); color:var(--warn); border:1px solid #f0dcb4;
  border-radius:12px; padding:10px 12px; font-size:15px; margin:12px 0 0;
}
footer.site { margin-top:26px; padding-top:14px; border-top:1px solid var(--line);
             color:var(--muted); font-size:14px; }
footer.site a { color:var(--brand); }
@media (max-width:380px) { .map { height:240px; } }

// زرار «افتح المكان على جوجل مابس».
//
// ⚠️ **ليه جوجل مش OpenStreetMap (٩ أكتوبر ٢٠٢٦، شكوى لؤي بالنص: «ما بيدخلوش
// على جوجل مابس»)**: الصفحة كانت بتفتح المكان على `openstreetmap.org`، والعيلة
// بتدوس وتلاقي موقع مش اللي على موبايلها — والزرار اللي مش بيعمل اللي متوقع
// منه **أسوأ من زرار مش موجود**. الخريطة **جوه** الصفحة فاضلة OpenStreetMap عن
// قصد (بلاطاتهم مجانية، والقاعدة عندنا «صفر جنيه»)، واللي اتغيّر الزرار بس.
//
// ⚠️ **وده لينك مش بلاطات**: `google.com/maps/search/?api=1&query=…` **مجاني
// وبلا مفتاح وبلا حساب فواتير** — وبيفتح تطبيق جوجل مابس على أندرويد وآيفون
// وعلى الويب لو مفيش تطبيق. اللي بمفتاح ومدفوع هو **بلاطات** جوجل اللي تترسم
// جوه الصفحة، ودي **ممنوعة** عندنا (نفس القاعدة المكتوبة في `mapAppUri`).
//
// ⚠️ **بلا اسم مكان عن قصد**: `query=30.6,31.0 (ميت يزيد)` جوجل بتقراها **بحث
// بالكلام** وممكن متلاقيش حاجة. الإحداثيات بس. حارسها في `check_brand_vectors.py`.
function mapLink(lat, lng) {
  return 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng;
}

// بلاطة واحدة بكسلاتها ٢٥٦ في كل الخرايط دي.
var TILE = 256;

// إسقاط ميركاتور: (lat,lng) → إحداثيات بلاطة كسرية عند تكبير معيّن.
//
// ⚠️ **لازم تفضل نفس المعادلة المكتوبة جوه `drawMap`** — لو اختلفوا، الخط
// (المسار) هيبان ماشي جنب الشارع مش عليه، والعيلة تفتكر الكابتن ماشي في
// البيوت. عشان كده المعادلة بقت دالة واحدة والاتنين بينادوا عليها.
function project(lat, lng, zoom) {
  var scale = Math.pow(2, zoom);
  var rad = lat * Math.PI / 180;
  return {
    x: (lng + 180) / 360 * scale,
    y: (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * scale
  };
}

// المقاطع اللي تنفع ترسم: مقطع من نقطتين على الأقل، وإحداثياته أرقام حقيقية.
//
// ⚠️ التشديد هنا مش تنطّع: الرد جاي من الشبكة وممكن يكون قديم/ناقص، والنقطة
// البايظة بتتحوّل `NaN` و`NaN` **بتقتل الـ SVG كله** (المتصفح بيرمي باقي
// `points` وهو ساكت) — يعني مسار سليم يختفي بسبب نقطة واحدة.
function normTrail(trail) {
  var out = [];
  if (!trail || !trail.length) return out;
  for (var s = 0; s < trail.length; s++) {
    var seg = trail[s], pts = [];
    if (!seg || !seg.length) continue;
    for (var i = 0; i < seg.length; i++) {
      var p = seg[i], la, ln;
      if (!p) continue;
      if (Array.isArray(p)) { la = Number(p[0]); ln = Number(p[1]); }
      else { la = Number(p.lat); ln = Number(p.lng); }
      if (!isFinite(la) || !isFinite(ln)) continue;
      if (la === 0 && ln === 0) continue;      // إحداثي مش موجود
      pts.push([la, ln]);
    }
    if (pts.length >= 2) out.push(pts);
  }
  return out;
}

// أحسن تكبير يخلّي **المسار كله** (والعربية معاه) باين على المقاس المتاح.
//
// ⚠️ ليه بنغيّر التكبير أصلًا؟ لأن الخريطة كانت بتتمركز على العربية بتكبير
// ثابت (١٦ ≈ شارعين) — يعني أول ما الكابتن يبعد، المسار يطلع بره الشاشة
// والعيلة تشوف خط داخل من الجنب مش عارفة جاي منين. الفايدة كلها في إن
// الطريق يبقى باين.
//
// ⚠️ **وبنقف عند ١٢**: على ١٢ عرض الخريطة ≈ ٥٠ كم — يعني وسط الغربية كله
// داخل، وأي مشوار بين قريتين (٥-١٠ كم) يبان كامل. السقف موجود عشان لو
// وصلنا مسار مجنون (خطأ بيانات) الخريطة ما تبقاش سطح الأرض كلها. الأهم إن
// **المسار كله يفضل باين**: الخط اللي بيتقص من غير ما حد يقول، العيلة
// بتفهمه إن دي الرحلة كلها وهو نصها.
// ⚠️ وبناخد **منتصف المسار** مركز، مش العربية: من غير كده المسار بيتقص من
// ناحية واحدة. والماركر بيتحط في مكانه الحقيقي بالحساب (شوف `drawMap`).
function fitView(segs, lat, lng, w, h, zoom) {
  var minLat = lat, maxLat = lat, minLng = lng, maxLng = lng;
  for (var s = 0; s < segs.length; s++) {
    for (var i = 0; i < segs[s].length; i++) {
      var p = segs[s][i];
      if (p[0] < minLat) minLat = p[0];
      if (p[0] > maxLat) maxLat = p[0];
      if (p[1] < minLng) minLng = p[1];
      if (p[1] > maxLng) maxLng = p[1];
    }
  }
  var z = zoom;
  while (z > 12) {
    var a = project(minLat, minLng, z), b = project(maxLat, maxLng, z);
    if (Math.abs(b.x - a.x) * TILE <= w * 0.8 &&
        Math.abs(b.y - a.y) * TILE <= h * 0.8) break;
    z--;
  }
  return { zoom: z, lat: (minLat + maxLat) / 2, lng: (minLng + maxLng) / 2 };
}

// بلاطات OpenStreetMap بحساب الإحداثيات — من غير أي مكتبة.
//
// [driver] = {lat, lng} مكان العربية (الماركر)، و[trail] = مقاطع المسار.
function drawMap(box, driver, trail, zoom) {
  var w = box.clientWidth, h = box.clientHeight;
  if (!w || !h) return;
  var segs = normTrail(trail);
  var lat = driver.lat, lng = driver.lng;
  if (segs.length) {
    var view = fitView(segs, lat, lng, w, h, zoom);
    lat = view.lat; lng = view.lng; zoom = view.zoom;
  }
  var p = project(lat, lng, zoom);
  var scale = Math.pow(2, zoom);
  var cx = Math.floor(p.x), cy = Math.floor(p.y);
  var originX = w / 2 - (p.x - cx) * TILE;   // يسار البلاطة المركزية
  var originY = h / 2 - (p.y - cy) * TILE;
  var c0 = Math.floor((0 - originX) / TILE), c1 = Math.floor((w - originX) / TILE);
  var r0 = Math.floor((0 - originY) / TILE), r1 = Math.floor((h - originY) / TILE);
  for (var c = c0; c <= c1; c++) {
    for (var r = r0; r <= r1; r++) {
      var tx = cx + c, ty = cy + r;
      if (tx < 0 || ty < 0 || tx >= scale || ty >= scale) continue;
      var img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.src = 'https://tile.openstreetmap.org/' + zoom + '/' + tx + '/' + ty + '.png';
      img.style.left = (originX + c * TILE) + 'px';
      img.style.top = (originY + r * TILE) + 'px';
      box.appendChild(img);
    }
  }

  // ── المسار فوق البلاطات ────────────────────────────────────────────
  if (segs.length) {
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'trail');
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    var layers = ['casing', 'line'];
    for (var li = 0; li < layers.length; li++) {
      for (var s2 = 0; s2 < segs.length; s2++) {
        var coords = [];
        for (var k = 0; k < segs[s2].length; k++) {
          var q = project(segs[s2][k][0], segs[s2][k][1], zoom);
          coords.push(
            (originX + (q.x - cx) * TILE) + ',' + (originY + (q.y - cy) * TILE));
        }
        var ln = document.createElementNS(NS, 'polyline');
        ln.setAttribute('class', layers[li]);
        ln.setAttribute('points', coords.join(' '));
        svg.appendChild(ln);
      }
    }
    box.appendChild(svg);
  }

  // الماركر بيتحط في **مكانه على الخريطة** بالحساب، مش في نص الشاشة.
  // ⚠️ كان `left:50%; top:50%` (نص الصندوق) — وده كان صح لما الخريطة كانت
  // متمركزة على العربية. دلوقتي المركز ممكن يبقى منتصف المسار، فالماركر
  // الثابت في النص بيقف في مكان الكابتن **مش** فيه — ومكان غلط بيبان صح
  // أخطر حاجة عندنا.
  var dp = project(driver.lat, driver.lng, zoom);
  var pin = el('div', 'pin');
  pin.style.left = (originX + (dp.x - cx) * TILE) + 'px';
  pin.style.top = (originY + (dp.y - cy) * TILE) + 'px';
  box.appendChild(pin);

  var credit = el('div', 'osm');
  var a = document.createElement('a');
  a.href = 'https://www.openstreetmap.org/copyright';
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = '© OpenStreetMap';
  credit.appendChild(a);
  box.appendChild(credit);
}

function ageText(seconds) {
  if (seconds === null || seconds === undefined) return '';
  if (seconds < 20) return 'المكان متحدّث دلوقتي';
  if (seconds < 60) return 'آخر تحديث للمكان قبل ' + seconds + ' ثانية';
  var m = Math.round(seconds / 60);
  return 'آخر تحديث للمكان قبل ' + m + ' دقيقة';
}

function renderLive(data) {
  var d = data.driver || {};
  var map = null;
  clear();
  var box = el('div', 'card');

  var st = el('div', 'status' + (d.online ? '' : ' off'),
              LABELS[data.status] || 'الرحلة شغالة');
  box.appendChild(st);

  var name = el('h1', null, d.first_name ? ('الكابتن ' + d.first_name) : 'الكابتن');
  box.appendChild(name);

  if (d.plate) {
    var row = el('div', 'kv');
    row.appendChild(el('span', 'k', 'اللوحة'));
    row.appendChild(el('span', 'v', d.plate));
    box.appendChild(row);
  }
  if (d.color) {
    var row2 = el('div', 'kv');
    row2.appendChild(el('span', 'k', 'اللون'));
    row2.appendChild(el('span', 'v', d.color));
    box.appendChild(row2);
  }

  if (d.online && d.lat !== null && d.lat !== undefined &&
      d.lng !== null && d.lng !== undefined) {
    map = el('div', 'map');
    box.appendChild(map);
    var open = document.createElement('a');
    open.className = 'btn';
    open.href = mapLink(d.lat, d.lng);
    open.target = '_blank';
    open.rel = 'noopener';
    open.textContent = 'افتح المكان على جوجل مابس';
    box.appendChild(open);
  } else {
    box.appendChild(el('p', 'big', 'العربية مش بتحدّث مكانها دلوقتي'));
    box.appendChild(el('p', 'muted',
      'يعني تطبيق الكابتن مقفول أو الشبكة عنده واقفة. اسأل صاحب الرحلة ' +
      'يطمّنك، والصفحة هتحدّث لوحدها أول ما يرجع.'));
  }

  var age = el('p', 'muted', ageText(data.__age));
  box.appendChild(age);
  box.appendChild(el('p', 'muted',
    'الصفحة بتحدّث لوحدها كل ١٥ ثانية. وفيها مكان العربية واسم الكابتن ' +
    'بس — مفيش اسم العميل ولا تليفونه ولا عنوانه.'));
  root.appendChild(box);

  // ⚠️ الرسم **بعد** ما الكارت يتضاف للصفحة، مش قبله: العنصر اللي لسه في
  // الذاكرة (مش في الـ DOM) مقاسه صفر، و`drawMap` بتقيس `clientWidth` —
  // فلو ناداها بدري بترجع من غير ما ترسم حاجة، والخريطة تطلع مستطيل فاضي.
  //
  // و`data.trail` هي **مسار الرحلة** المسجّل (ميجريشن ٠٠٦٣) — نفس الشكل اللي
  // الكابتن ماشي بيه على شاشة العميل، والصفحة بترسمه وراه.
  if (map) drawMap(map, { lat: d.lat, lng: d.lng }, data.trail, 16);
}

function render(data) {
  if (!data || data.state === 'unknown') {
    if (lastData) return;   // عندنا كارت شغّال — مانكسروش بسبب رد غريب
    showMessage('اللينك ده مش شغّال', [
      { text: 'ممكن الرحلة تكون خلصت، أو صاحب الرحلة قفل اللينك، أو ' +
              'اللينك اتنسخ ناقص. اتكلّم على صاحب الرحلة وهو يبعتلك لينك جديد.' },
      { text: 'مفيش أي بيانات شخصية بتظهر على الصفحة دي في كل الحالات.',
        muted: true },
    ], reloadButton());
    stop();
    return;
  }
  if (data.state === 'finished') {
    showMessage('الرحلة خلصت', [
      { text: 'الحمد لله، العربية وصلت. خلاص مفيش مكان بيتعرض بعد وصول ' +
              'الرحلة — ده مقصود عشان محدش يفضل يشوف حد وهو واقف.' },
    ]);
    stop();
    return;
  }
  renderLive(data);
}

function stop() { if (timer) { clearInterval(timer); timer = null; } }

function tick() {
  var box = document.getElementById('net');
  if (box) box.remove();
  fetch(SUPABASE_URL + '/rest/v1/rpc/shared_ride', {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ p_token: token })
  }).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function (data) {
    // ⚠️ العمر بيتحسب من **وقت السيرفر** (`server_time` ناقص `updated_at`)
    // مش من ساعة الموبايل: ساعة موبايل مضبوطة غلط كانت هتقول «متحدّث» وهي
    // واقفة من عشر دقايق، أو العكس.
    if (data && data.driver && data.driver.updated_at && data.server_time) {
      data.__age = Math.max(0, Math.round(
        (new Date(data.server_time) - new Date(data.driver.updated_at)) / 1000));
    }
    if (data && data.state !== 'unknown') lastData = data;
    render(data);
  }).catch(function () {
    if (lastData) {
      // عندنا كارت شغّال — منكسرش الشكل بسبب انقطاع شبكة لحظي، بس لازم
      // نقول إن الرقم اللي فوق **مش لايف** (نفس منطق نبضة الأونلاين).
      if (!document.getElementById('net')) {
        var w = el('div', 'warn',
          'الشبكة عندك واقفة دلوقتي — اللي تحت آخر حاجة عرفناها. ' +
          'هنكرر لوحدنا.');
        w.id = 'net';
        root.insertBefore(w, root.firstChild);
      }
      return;
    }
    showMessage('مش قادرين نوصل بالنت', [
      { text: 'اتأكد إن النت شغّال على موبايلك وجرّب تاني.' },
    ], reloadButton());
  });
}

function start() {
  if (!tokenOk) {
    showMessage('مفيش رحلة في اللينك', [
      { text: 'اللينك لازم يكون فيه كود الرحلة بعد علامة الاستفهام. ' +
              'اطلب من صاحب الرحلة يبعتلك اللينك كامل.' },
    ], reloadButton());
    return;
  }
  tick();
  timer = setInterval(tick, REFRESH_MS);
  // رجوع الصفحة للمقدمة = لحظة طبيعية للتحديث (الموبايل كان مقفول أو في
  // تطبيق تاني)، وإلا العيلة تقعد تستنى لحد الدورة الجاية.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && timer) tick();
  });
}

start();
</script>
