<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متابعة الرحلة — تكتوك بلدنا</title>
<meta name="description" content="متابعة رحلة على تكتوك بلدنا">
<!-- اللينك خاص بين العميل وأهله — مفيش داعي يتفهرس في جوجل. -->
<meta name="robots" content="noindex, nofollow">
<style>
:root { --brand:#118A50; --ink:#12201f; --muted:#5f6b6a; --line:#dfe6e5;
        --bg:#f4f8f7; --card:#ffffff; --warn:#8a5a00; --warnbg:#fff6e5; }
* { box-sizing: border-box; }
body {
  margin:0 auto; padding:18px 14px 48px; max-width:560px; background:var(--bg); color:var(--ink);
  font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", "Traditional Arabic", system-ui, sans-serif;
  font-size:17px; line-height:1.8;
}
header.site { padding-bottom:12px; margin-bottom:16px; border-bottom:2px solid var(--brand); }
header.site .name { font-weight:700; color:var(--brand); font-size:19px; }
.card {
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:18px 16px; box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.card + .card { margin-top:14px; }
h1 { font-size:22px; line-height:1.5; margin:0 0 4px; color:var(--brand); }
h2 { font-size:20px; margin:0 0 8px; color:var(--brand); }
p { margin:10px 0; }
.muted { color:var(--muted); font-size:15px; }
.big { font-size:19px; font-weight:700; }
.status {
  display:inline-block; background:var(--brand); color:#fff; font-weight:700;
  padding:6px 14px; border-radius:999px; font-size:16px; margin-bottom:14px;
}
.status.off { background:var(--muted); }
.kv { display:flex; gap:10px; margin:6px 0; font-size:17px; }
.kv .k { color:var(--muted); min-width:74px; }
.kv .v { font-weight:700; }
.map {
  position:relative; height:280px; margin:14px 0 6px; border-radius:14px;
  overflow:hidden; background:#e8edec; border:1px solid var(--line);
}
.map img { position:absolute; width:256px; height:256px; max-width:none; user-select:none; }
.map .pin {
  position:absolute; left:50%; top:50%; width:20px; height:20px; margin:-10px 0 0 -10px;
  border-radius:50%; background:var(--brand); border:4px solid #fff;
  box-shadow:0 1px 6px rgba(0,0,0,.35);
}
.map .osm {
  position:absolute; inset-inline-end:6px; bottom:4px; background:rgba(255,255,255,.88);
  font-size:12px; padding:1px 6px; border-radius:6px;
}
.map .osm a { color:#4a5a58; text-decoration:none; }
.btn {
  display:block; text-align:center; text-decoration:none; margin-top:14px;
  background:var(--brand); color:#fff; font-weight:700; font-size:17px;
  padding:13px 16px; border-radius:12px;
}
.btn.ghost { background:transparent; color:var(--brand); border:2px solid var(--brand); }
.warn {
  background:var(--warnbg); color:var(--warn); border:1px solid #f0dcb4;
  border-radius:12px; padding:10px 12px; font-size:15px; margin:12px 0 0;
}
footer.site { margin-top:26px; padding-top:14px; border-top:1px solid var(--line);
             color:var(--muted); font-size:14px; }
footer.site a { color:var(--brand); }
@media (max-width:380px) { .map { height:240px; } }
</style>
</head>
<body>
<header class="site">
  <div class="name">تكتوك بلدنا — ميت يزيد والقرشية</div>
</header>
<main id="root"><p class="muted">بنجيب الرحلة…</p></main>
<footer class="site">
  صفحة متابعة رحلة على تكتوك بلدنا. للتواصل:
  <a href="mailto:loay.shehata@gmail.com">loay.shehata@gmail.com</a> — 01028574799
</footer>
<script>
var SUPABASE_URL = 'https://hqxozsefompgepedozwo.supabase.co';
var SUPABASE_KEY = 'sb_publishable_gMhUc1_CHGjIMysbxfuvQg_92GQ9vOo';
var LABELS = {"accepted": "الكابتن قبل الطلب وجاي", "arrived": "الكابتن وصل مكان الالتقاط", "started": "الرحلة ماشية دلوقتي"};
var REFRESH_MS = 15000;

var token = '';
try { token = (new URLSearchParams(location.search).get('t') || '').trim(); } catch (e) { token = ''; }
var tokenOk = /^[A-Za-z0-9_-]{32,128}$/.test(token);

var root = document.getElementById('root');
var timer = null;
var lastData = null;

function el(tag, cls, text) {
  var node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function card(title, lines) {
  var box = el('div', 'card');
  if (title) box.appendChild(el('h2', null, title));
  (lines || []).forEach(function (line) {
    box.appendChild(el('p', line.muted ? 'muted' : null, line.text));
  });
  return box;
}

function clear() { while (root.firstChild) root.removeChild(root.firstChild); }

function showMessage(title, lines, extra) {
  clear();
  var box = card(title, lines);
  if (extra) box.appendChild(extra);
  root.appendChild(box);
}

function reloadButton() {
  var b = el('a', 'btn ghost', 'جرّب تاني');
  b.href = 'javascript:location.reload()';
  return b;
}

function mapLink(lat, lng) {
  return 'https://www.openstreetmap.org/?mlat=' + lat + '&mlon=' + lng +
         '#map=17/' + lat + '/' + lng;
}

// بلاطات OpenStreetMap بحساب الإحداثيات — من غير أي مكتبة.
function drawMap(box, lat, lng, zoom) {
  var TILE = 256;
  var w = box.clientWidth, h = box.clientHeight;
  if (!w || !h) return;
  var scale = Math.pow(2, zoom);
  var xf = (lng + 180) / 360 * scale;
  var rad = lat * Math.PI / 180;
  var yf = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * scale;
  var cx = Math.floor(xf), cy = Math.floor(yf);
  var originX = w / 2 - (xf - cx) * TILE;   // يسار البلاطة المركزية
  var originY = h / 2 - (yf - cy) * TILE;
  var c0 = Math.floor((0 - originX) / TILE), c1 = Math.floor((w - originX) / TILE);
  var r0 = Math.floor((0 - originY) / TILE), r1 = Math.floor((h - originY) / TILE);
  for (var c = c0; c <= c1; c++) {
    for (var r = r0; r <= r1; r++) {
      var tx = cx + c, ty = cy + r;
      if (tx < 0 || ty < 0 || tx >= scale || ty >= scale) continue;
      var img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.src = 'https://tile.openstreetmap.org/' + zoom + '/' + tx + '/' + ty + '.png';
      img.style.left = (originX + c * TILE) + 'px';
      img.style.top = (originY + r * TILE) + 'px';
      box.appendChild(img);
    }
  }
  box.appendChild(el('div', 'pin'));
  var credit = el('div', 'osm');
  var a = document.createElement('a');
  a.href = 'https://www.openstreetmap.org/copyright';
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = '© OpenStreetMap';
  credit.appendChild(a);
  box.appendChild(credit);
}

function ageText(seconds) {
  if (seconds === null || seconds === undefined) return '';
  if (seconds < 20) return 'المكان متحدّث دلوقتي';
  if (seconds < 60) return 'آخر تحديث للمكان قبل ' + seconds + ' ثانية';
  var m = Math.round(seconds / 60);
  return 'آخر تحديث للمكان قبل ' + m + ' دقيقة';
}

function renderLive(data) {
  var d = data.driver || {};
  var map = null;
  clear();
  var box = el('div', 'card');

  var st = el('div', 'status' + (d.online ? '' : ' off'),
              LABELS[data.status] || 'الرحلة شغالة');
  box.appendChild(st);

  var name = el('h1', null, d.first_name ? ('الكابتن ' + d.first_name) : 'الكابتن');
  box.appendChild(name);

  if (d.plate) {
    var row = el('div', 'kv');
    row.appendChild(el('span', 'k', 'اللوحة'));
    row.appendChild(el('span', 'v', d.plate));
    box.appendChild(row);
  }
  if (d.color) {
    var row2 = el('div', 'kv');
    row2.appendChild(el('span', 'k', 'اللون'));
    row2.appendChild(el('span', 'v', d.color));
    box.appendChild(row2);
  }

  if (d.online && d.lat !== null && d.lat !== undefined &&
      d.lng !== null && d.lng !== undefined) {
    map = el('div', 'map');
    box.appendChild(map);
    var open = document.createElement('a');
    open.className = 'btn';
    open.href = mapLink(d.lat, d.lng);
    open.target = '_blank';
    open.rel = 'noopener';
    open.textContent = 'افتح المكان على الخريطة';
    box.appendChild(open);
  } else {
    box.appendChild(el('p', 'big', 'العربية مش بتحدّث مكانها دلوقتي'));
    box.appendChild(el('p', 'muted',
      'يعني تطبيق الكابتن مقفول أو الشبكة عنده واقفة. اسأل صاحب الرحلة ' +
      'يطمّنك، والصفحة هتحدّث لوحدها أول ما يرجع.'));
  }

  var age = el('p', 'muted', ageText(data.__age));
  box.appendChild(age);
  box.appendChild(el('p', 'muted',
    'الصفحة بتحدّث لوحدها كل ١٥ ثانية. وفيها مكان العربية واسم الكابتن ' +
    'بس — مفيش اسم العميل ولا تليفونه ولا عنوانه.'));
  root.appendChild(box);

  // ⚠️ الرسم **بعد** ما الكارت يتضاف للصفحة، مش قبله: العنصر اللي لسه في
  // الذاكرة (مش في الـ DOM) مقاسه صفر، و`drawMap` بتقيس `clientWidth` —
  // فلو ناداها بدري بترجع من غير ما ترسم حاجة، والخريطة تطلع مستطيل فاضي.
  if (map) drawMap(map, d.lat, d.lng, 16);
}

function render(data) {
  if (!data || data.state === 'unknown') {
    if (lastData) return;   // عندنا كارت شغّال — مانكسروش بسبب رد غريب
    showMessage('اللينك ده مش شغّال', [
      { text: 'ممكن الرحلة تكون خلصت، أو صاحب الرحلة قفل اللينك، أو ' +
              'اللينك اتنسخ ناقص. اتكلّم على صاحب الرحلة وهو يبعتلك لينك جديد.' },
      { text: 'مفيش أي بيانات شخصية بتظهر على الصفحة دي في كل الحالات.',
        muted: true },
    ], reloadButton());
    stop();
    return;
  }
  if (data.state === 'finished') {
    showMessage('الرحلة خلصت', [
      { text: 'الحمد لله، العربية وصلت. خلاص مفيش مكان بيتعرض بعد وصول ' +
              'الرحلة — ده مقصود عشان محدش يفضل يشوف حد وهو واقف.' },
    ]);
    stop();
    return;
  }
  renderLive(data);
}

function stop() { if (timer) { clearInterval(timer); timer = null; } }

function tick() {
  var box = document.getElementById('net');
  if (box) box.remove();
  fetch(SUPABASE_URL + '/rest/v1/rpc/shared_ride', {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ p_token: token })
  }).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function (data) {
    // ⚠️ العمر بيتحسب من **وقت السيرفر** (`server_time` ناقص `updated_at`)
    // مش من ساعة الموبايل: ساعة موبايل مضبوطة غلط كانت هتقول «متحدّث» وهي
    // واقفة من عشر دقايق، أو العكس.
    if (data && data.driver && data.driver.updated_at && data.server_time) {
      data.__age = Math.max(0, Math.round(
        (new Date(data.server_time) - new Date(data.driver.updated_at)) / 1000));
    }
    if (data && data.state !== 'unknown') lastData = data;
    render(data);
  }).catch(function () {
    if (lastData) {
      // عندنا كارت شغّال — منكسرش الشكل بسبب انقطاع شبكة لحظي، بس لازم
      // نقول إن الرقم اللي فوق **مش لايف** (نفس منطق نبضة الأونلاين).
      if (!document.getElementById('net')) {
        var w = el('div', 'warn',
          'الشبكة عندك واقفة دلوقتي — اللي تحت آخر حاجة عرفناها. ' +
          'هنكرر لوحدنا.');
        w.id = 'net';
        root.insertBefore(w, root.firstChild);
      }
      return;
    }
    showMessage('مش قادرين نوصل بالنت', [
      { text: 'اتأكد إن النت شغّال على موبايلك وجرّب تاني.' },
    ], reloadButton());
  });
}

function start() {
  if (!tokenOk) {
    showMessage('مفيش رحلة في اللينك', [
      { text: 'اللينك لازم يكون فيه كود الرحلة بعد علامة الاستفهام. ' +
              'اطلب من صاحب الرحلة يبعتلك اللينك كامل.' },
    ], reloadButton());
    return;
  }
  tick();
  timer = setInterval(tick, REFRESH_MS);
  // رجوع الصفحة للمقدمة = لحظة طبيعية للتحديث (الموبايل كان مقفول أو في
  // تطبيق تاني)، وإلا العيلة تقعد تستنى لحد الدورة الجاية.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && timer) tick();
  });
}

start();
</script>
</body>
</html>
