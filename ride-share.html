<!-- اللينك خاص بين العميل وأهله — مفيش داعي يتفهرس في جوجل. -->
<meta name="robots" content="noindex, nofollow">
<style>
:root { --brand:#118A50; --ink:#12201f; --muted:#5f6b6a; --line:#dfe6e5;
        --bg:#f4f8f7; --card:#ffffff; --warn:#8a5a00; --warnbg:#fff6e5; }
* { box-sizing: border-box; }
body {
  margin:0 auto; padding:18px 14px 48px; max-width:560px; background:var(--bg); color:var(--ink);
  font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", "Traditional Arabic", system-ui, sans-serif;
  font-size:17px; line-height:1.8;
}
header.site { padding-bottom:12px; margin-bottom:16px; border-bottom:2px solid var(--brand); }
header.site .name { font-weight:700; color:var(--brand); font-size:19px; }
.card {
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:18px 16px; box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.card + .card { margin-top:14px; }
h1 { font-size:22px; line-height:1.5; margin:0 0 4px; color:var(--brand); }
h2 { font-size:20px; margin:0 0 8px; color:var(--brand); }
p { margin:10px 0; }
.muted { color:var(--muted); font-size:15px; }
.big { font-size:19px; font-weight:700; }
.status {
  display:inline-block; background:var(--brand); color:#fff; font-weight:700;
  padding:6px 14px; border-radius:999px; font-size:16px; margin-bottom:14px;
}
.status.off { background:var(--muted); }
.kv { display:flex; gap:10px; margin:6px 0; font-size:17px; }
.kv .k { color:var(--muted); min-width:74px; }
.kv .v { font-weight:700; }
.map {
  position:relative; height:280px; margin:14px 0 6px; border-radius:14px;
  overflow:hidden; background:#e8edec; border:1px solid var(--line);
  /* ⚠️ **`touch-action` هي اللي بتخلي القرصة بتاعة الخريطة مش الصفحة**
     (شكوى لؤي ١١ أكتوبر ٢٠٢٦: «زوم الخريطة مش مظبوط — بيزوم الصفحة كلها
     وليس الخريطة»). `pan-y` معناها: **اسحب بإصبع واحد = الصفحة تتزحلق عادي**
     (وعشان كده مش `none` — الخريطة نص الشاشة، وفجأة الصفحة تبقى مش بتتسحب =
     المستخدم يفتكر الموقع باظ)، و**قرصة بإصبعين = بتاعتنا إحنا** (المتصفح مش
     هيزوّم الصفحة، والـ JS هي اللي هتكبّر الخريطة — شوف `bindGestures`).
     ⚠️ ومفيش `user-scalable=no` في الـ`viewport` عن قصد: تكبير **نص** الصفحة
     لازم يفضل شغال (ده نص قانوني وأهالي بيعانوا في القراية) — اللي اتقفل هو
     القرصة على الخريطة بس، مش على الصفحة. */
  touch-action:pan-y; user-select:none;
}
/* ⚠️ **الترتيب بـ`z-index` مش بترتيب الإضافة للـDOM** — لأن عُقد الخريطة
   (البلاطات والخط والماركر وسطر الحقوق والأزرار) بتتعمل **مرة واحدة** وبتتحدّث
   في مكانها بعد كده (شوف `mapRepo` و`drawMap`)، فأي بلاطة جديدة بتتضاف **آخر**
   الصندوق وبتبقى فوق الماركر والأزرار من غير الأرقام دي. */
.map img { position:absolute; width:256px; height:256px; max-width:none; user-select:none; z-index:0; }
/* مسار الرحلة — طبقة SVG فوق البلاطات.
   ⚠️ `pointer-events:none` عشان الخط ما يمنعش السحب/الدوس على الخريطة،
   و`overflow` من `.map` هو اللي بيقص الخط لو طلع بره.
   والخط بيترسم **مرتين**: طبقة بيضا عريضة تحت (كيسنج) وطبقة بلون الهوية فوق —
   من غير الكيسنج الخط بيختفي على البلاطات الفاتحة (شوارع الرمل والشوارع
   البيضا) والكابتن يبان ماشي في الفراغ. */
.map svg.trail { position:absolute; left:0; top:0; pointer-events:none; z-index:1; }
.map svg.trail polyline { fill:none; stroke-linecap:round; stroke-linejoin:round; }
.map svg.trail polyline.casing { stroke:#ffffff; stroke-opacity:.85; stroke-width:9; }
.map svg.trail polyline.line { stroke:var(--brand); stroke-opacity:.95; stroke-width:5; }
.map .pin {
  /* ⚠️ `left/top` دول **قيمة احتياطية بس** — الـ JS بتحسب مكان الكابتن على
     الخريطة وتحطها inline (شوف `drawMap`)، لأن مركز الخريطة بقى منتصف
     المسار مش مكان العربية. لو الحساب ما اشتغلش لأي سبب، الماركر يقف في
     النص (سلوك النسخة القديمة) أحسن من ما يختفي. */
  position:absolute; left:50%; top:50%; width:20px; height:20px; margin:-10px 0 0 -10px;
  border-radius:50%; background:var(--brand); border:4px solid #fff;
  box-shadow:0 1px 6px rgba(0,0,0,.35); z-index:2;
}
.map .osm {
  position:absolute; inset-inline-end:6px; bottom:4px; background:rgba(255,255,255,.88);
  font-size:12px; padding:1px 6px; border-radius:6px; z-index:3;
}
.map .osm a { color:#4a5a58; text-decoration:none; }
/* أزرار تكبير الخريطة + «الرحلة» (إرجاع المنظر الكامل).
   ⚠️ **مقاس ٤٤ نقطة** مش ذوق: ده أدنى مقاس للدوسة بالإصبع (وقاعدة المشروع في
   التطبيقات — قاعدة ١٢). ومحطوطين فوق في ناحية `inset-inline-start` (يمين في
   العربي) بعيد عن سطر حقوق OpenStreetMap اللي في الناحية التانية. */
.map .ctl {
  /* فوق في ناحية `inset-inline-start` (يمين في العربي) — عشان ما يزحمش سطر
     حقوق OpenStreetMap اللي تحت في الناحية التانية. */
  position:absolute; inset-inline-start:6px; top:6px;
  display:flex; flex-direction:column; gap:6px; z-index:4;
}
.map .ctl button {
  width:44px; height:44px; padding:0; border-radius:10px; cursor:pointer;
  border:1px solid var(--line); background:rgba(255,255,255,.94);
  color:var(--ink); font-family:inherit; font-size:24px; font-weight:700; line-height:1;
  touch-action:manipulation;
}
.map .ctl button.wide { width:auto; padding:0 10px; font-size:14px; }
.map .ctl button[disabled] { opacity:.4; }
.btn {
  display:block; text-align:center; text-decoration:none; margin-top:14px;
  background:var(--brand); color:#fff; font-weight:700; font-size:17px;
  padding:13px 16px; border-radius:12px;
}
.btn.ghost { background:transparent; color:var(--brand); border:2px solid var(--brand); }
.warn {
  background:var(--warnbg); color:var(--warn); border:1px solid #f0dcb4;
  border-radius:12px; padding:10px 12px; font-size:15px; margin:12px 0 0;
}
footer.site { margin-top:26px; padding-top:14px; border-top:1px solid var(--line);
             color:var(--muted); font-size:14px; }
footer.site a { color:var(--brand); }
@media (max-width:380px) { .map { height:240px; } }
</style>

<script>
var SUPABASE_URL = 'https://hqxozsefompgepedozwo.supabase.co';
var SUPABASE_KEY = 'sb_publishable_gMhUc1_CHGjIMysbxfuvQg_92GQ9vOo';

try { token = (new URLSearchParams(location.search).get('t') || '').trim(); } catch (e) { token = ''; }
var tokenOk = /^[A-Za-z0-9_-]{32,128}$/.test(token);

var root = document.getElementById('root');
var timer = null;
var lastData = null;

function el(tag, cls, text) {
  var node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function card(title, lines) {
  var box = el('div', 'card');
  if (title) box.appendChild(el('h2', null, title));
  (lines || []).forEach(function (line) {
    box.appendChild(el('p', line.muted ? 'muted' : null, line.text));

function clear() { while (root.firstChild) root.removeChild(root.firstChild); }

function showMessage(title, lines, extra) {

function reloadButton() {
  var b = el('a', 'btn ghost', 'جرّب تاني');
  b.href = 'javascript:location.reload()';
  return b;

// زرار «افتح المكان على جوجل مابس».
//
// ⚠️ **ليه جوجل مش OpenStreetMap (٩ أكتوبر ٢٠٢٦، شكوى لؤي بالنص: «ما بيدخلوش
// على جوجل مابس»)**: الصفحة كانت بتفتح المكان على `openstreetmap.org`، والعيلة
// بتدوس وتلاقي موقع مش اللي على موبايلها — والزرار اللي مش بيعمل اللي متوقع
// منه **أسوأ من زرار مش موجود**. الخريطة **جوه** الصفحة فاضلة OpenStreetMap عن
// قصد (بلاطاتهم مجانية، والقاعدة عندنا «صفر جنيه»)، واللي اتغيّر الزرار بس.
//
// ⚠️ **وده لينك مش بلاطات**: `google.com/maps/search/?api=1&query=…` **مجاني
// وبلا مفتاح وبلا حساب فواتير** — وبيفتح تطبيق جوجل مابس على أندرويد وآيفون
// وعلى الويب لو مفيش تطبيق. اللي بمفتاح ومدفوع هو **بلاطات** جوجل اللي تترسم
// جوه الصفحة، ودي **ممنوعة** عندنا (نفس القاعدة المكتوبة في `mapAppUri`).
//
// ⚠️ **بلا اسم مكان عن قصد**: `query=30.6,31.0 (ميت يزيد)` جوجل بتقراها **بحث
// بالكلام** وممكن متلاقيش حاجة. الإحداثيات بس. حارسها في `check_brand_vectors.py`.
function mapLink(lat, lng) {
  return 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng;
}

// بلاطة واحدة بكسلاتها ٢٥٦ في كل الخرايط دي.
var TILE = 256;

// حدود التكبير المسموح بيها بالإيد (بلاطات OSM بتوصل لحد ١٩).
var MIN_ZOOM = 12, MAX_ZOOM = 19;

// ── حالة العرض: **بره الـ DOM عن قصد** ──────────────────────────────────────
//
// ⚠️ **دي قلب الإصلاح** (شكوى لؤي ١١ أكتوبر ٢٠٢٦ بالنص: «زوم الخريطة مش مظبوط
// بيزوم الصفحة كلها وليس الخريطة»). الصفحة بتفضّي الكارت **وتعيد بناءه من
// الأول** كل ١٥ ثانية (`renderLive` بتبدأ بـ`clear()`)، فلو التكبير اللي
// اختاره المستخدم كان متخزّن في العنصر نفسه (`style` أو `data-*`)، كان
// **اتمسح** مع أول تحديث: العيلة تكبّر الخريطة، وبعد ١٥ ثانية ترجع لحالها
// وكإنها ما عملتش حاجة — عطل صامت تمامًا. فالحالة هنا في متغيّر **بره الشجرة**.
//
// `null` = تلقائي: المسار كله باين (نفس سلوك النسخة القديمة).
var mapState = null;

// منظر **مؤقّت** وقت القرصة بالإصبعين بس: النقطة اللي تحت الصباع تفضل مكانها.
// أول ما الصباع يترفع بنثبّت رقم التكبير وبنرجّع المركز على العربية.
var pinchView = null;

// آخر حاجة اترسمت — الأزرار والقرصة بتشتغل من هنا.
var lastMap = null;

// تحديث اتأجّل لأن القرصة كانت شغّالة (شوف `tick` و`endPinch`).
var pendingRefresh = false;

// إسقاط ميركاتور: (lat,lng) → إحداثيات بلاطة كسرية عند تكبير معيّن.
//
// ⚠️ **لازم تفضل نفس المعادلة المكتوبة جوه `drawMap`** — لو اختلفوا، الخط
// (المسار) هيبان ماشي جنب الشارع مش عليه، والعيلة تفتكر الكابتن ماشي في
// البيوت. عشان كده المعادلة بقت دالة واحدة والاتنين بينادوا عليها.
// (وبتشتغل على أي تكبير — صحيح أو كسري: `project(x, y, 16.5)`.)
function project(lat, lng, zoom) {
  var scale = Math.pow(2, zoom);
  var rad = lat * Math.PI / 180;
  return {
    x: (lng + 180) / 360 * scale,
    y: (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * scale
  };
}

// نفس الإسقاط بس **بالبكسل** (بكسل العالم عند التكبير ده) — البلاطة ٢٥٦ بكسل.
function worldPx(lat, lng, zoom) {
  var p = project(lat, lng, zoom);
  return { x: p.x * TILE, y: p.y * TILE };
}

// العكس: بكسل العالم → (lat,lng). محتاجينها عشان **القرصة تحافظ على النقطة
// اللي تحت الصباع** (`zoomAt`) بدل ما الخريطة تزوّم حوالين مركزها.
function unproject(x, y, zoom) {
  var scale = Math.pow(2, zoom);
  var n = Math.PI - 2 * Math.PI * (y / TILE) / scale;
  return {
    lat: 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))),
    lng: (x / TILE) / scale * 360 - 180
  };
}

function clampZoom(z) {
  if (!isFinite(z)) return 16;
  return Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z));
}

// المقاطع اللي تنفع ترسم: مقطع من نقطتين على الأقل، وإحداثياته أرقام حقيقية.
//
// ⚠️ التشديد هنا مش تنطّع: الرد جاي من الشبكة وممكن يكون قديم/ناقص، والنقطة
// البايظة بتتحوّل `NaN` و`NaN` **بتقتل الـ SVG كله** (المتصفح بيرمي باقي
// `points` وهو ساكت) — يعني مسار سليم يختفي بسبب نقطة واحدة.
function normTrail(trail) {
  var out = [];
  if (!trail || !trail.length) return out;
  for (var s = 0; s < trail.length; s++) {
    var seg = trail[s], pts = [];
    if (!seg || !seg.length) continue;
    for (var i = 0; i < seg.length; i++) {
      var p = seg[i], la, ln;
      if (!p) continue;
      if (Array.isArray(p)) { la = Number(p[0]); ln = Number(p[1]); }
      else { la = Number(p.lat); ln = Number(p.lng); }
      if (!isFinite(la) || !isFinite(ln)) continue;
      if (la === 0 && ln === 0) continue;      // إحداثي مش موجود
      pts.push([la, ln]);
    }
    if (pts.length >= 2) out.push(pts);
  }
  return out;
}

// أحسن تكبير يخلّي **المسار كله** (والعربية معاه) باين على المقاس المتاح.
//
// ⚠️ ليه بنغيّر التكبير أصلًا؟ لأن الخريطة كانت بتتمركز على العربية بتكبير
// ثابت (١٦ ≈ شارعين) — يعني أول ما الكابتن يبعد، المسار يطلع بره الشاشة
// والعيلة تشوف خط داخل من الجنب مش عارفة جاي منين. الفايدة كلها في إن
// الطريق يبقى باين.
//
// ⚠️ **وبنقف عند ١٢**: على ١٢ عرض الخريطة ≈ ٥٠ كم — يعني وسط الغربية كله
// داخل، وأي مشوار بين قريتين (٥-١٠ كم) يبان كامل. السقف موجود عشان لو
// وصلنا مسار مجنون (خطأ بيانات) الخريطة ما تبقاش سطح الأرض كلها. الأهم إن
// **المسار كله يفضل باين**: الخط اللي بيتقص من غير ما حد يقول، العيلة
// بتفهمه إن دي الرحلة كلها وهو نصها.
// ⚠️ وبناخد **منتصف المسار** مركز، مش العربية: من غير كده المسار بيتقص من
// ناحية واحدة. والماركر بيتحط في مكانه الحقيقي بالحساب (شوف `drawMap`).
function fitView(segs, lat, lng, w, h, zoom) {
  var minLat = lat, maxLat = lat, minLng = lng, maxLng = lng;
  for (var s = 0; s < segs.length; s++) {
    for (var i = 0; i < segs[s].length; i++) {
      var p = segs[s][i];
      if (p[0] < minLat) minLat = p[0];
      if (p[0] > maxLat) maxLat = p[0];
      if (p[1] < minLng) minLng = p[1];
      if (p[1] > maxLng) maxLng = p[1];
    }
  }
  var z = zoom;
  while (z > 12) {
    var a = project(minLat, minLng, z), b = project(maxLat, maxLng, z);
    if (Math.abs(b.x - a.x) * TILE <= w * 0.8 &&
        Math.abs(b.y - a.y) * TILE <= h * 0.8) break;
    z--;
  }
  return { zoom: z, lat: (minLat + maxLat) / 2, lng: (minLng + maxLng) / 2 };
}

// ── التكبير بالإيد ───────────────────────────────────────────────────────────
//
// الأربع دوال دي هي كل واجهة التحكّم في المنظر. **مفيش فيهم حاجة بتلمس
// `mapState` غير اللي المفروض** — عشان كده التحديث الدوري (١٥ ثانية) مش
// بيضيّع اختيار المستخدم.

// التكبير المعروض دلوقتي (لو مفيش حاجة اترسمت: ١٦ = الافتراضي).
function shownZoom() {
  if (pinchView) return pinchView.zoom;
  if (mapState) return mapState.zoom;
  if (lastMap) return lastMap.state.zoom;
  return 16;
}

// إعادة رسم الصندوق اللي على الشاشة بالحالة الحالية.
//
// ⚠️⚠️ **ممنوع نمسح الصندوق ونبني من الأول — وده مش تحسين أداء، ده عطل اتقاس.**
// المتصفح **بيقطع سلسلة اللمس** لما العنصر اللي الصباع بدأ عليه يتشال من الصفحة.
// و`redraw` كانت بتعمل `while (box.firstChild) box.removeChild(...)` — يعني
// **البلاطة اللي تحت الصباع بتتشال** أول ما القرصة تبدأ → المتصفح بيسيب اللمسة:
// القرصة كانت بتزوّم **خطوة واحدة** وبعدها تسكت، و`touchend` عمره ما بينده على
// `endPinch` (يعني التكبير ما يتثبتش والمركز ما يرجعش للعربية).
//
// 📐 **القياس** (Chrome على الموبايل SM-S948B، ١١ أكتوبر ٢٠٢٦، نفس الصفحة
// ونفس القرصة اللي بتتولّد من `Input.dispatchTouchEvent`):
//   • الصفحة الحقيقية وهي بتمسح الطفل: `{touchstart:2, touchmove:1, touchend:0}`
//   • صفحة تجريبية بنفس الـCSS وبتحافظ على العُقد: `{touchstart:2, touchmove:8,
//     touchend:2}`
//   • وصفحة تجريبية **بتمسح الطفل في أول حركة**: `{ts:2, tm:1, te:0}` —
//     نفس بصمة العطل بالظبط.
// فالـ`drawMap` بتعيد استخدام **نفس** عُقد البلاطات والخط والماركر وسطر الحقوق
// والأزرار (شوف `mapRepo`) — مفيش عقدة بتتشال أبدًا، والزيادة بتتخبّى بـ
// `display:none`. (والحارس: `tool/check_share_trail.js` §٩.)
function redraw() {
  if (!lastMap) return;
  drawMap(lastMap.box, lastMap.driver, lastMap.segs, lastMap.start);
}

// تكبير/تصغير بزرار — حوالين نص الخريطة.
function zoomBy(delta) {
  mapState = { zoom: clampZoom(shownZoom() + delta) };
  pinchView = null;
  redraw();
}

// القرصة بالإصبعين: **النقطة اللي تحت الصباع تفضل مكانها** (بنتحرك حوالين
// `(sx,sy)`). من غير الحساب ده الخريطة بتزوّم حوالين مركزها والصورة «بتنط».
function zoomAt(newZoom, sx, sy) {
  if (!lastMap) return;
  var base = lastMap.state;                 // اللي مرسوم على الشاشة دلوقتي
  var z = clampZoom(newZoom);
  var w = lastMap.box.clientWidth, h = lastMap.box.clientHeight;
  var bc = worldPx(base.lat, base.lng, base.zoom);
  // النقطة الجغرافية اللي تحت (sx,sy) قبل التكبير…
  var anchor = unproject(bc.x + (sx - w / 2), bc.y + (sy - h / 2), base.zoom);
  // …وبعد التكبير الجديد: المركز اللي يخلّي نفس النقطة تحت نفس المكان.
  var ac = worldPx(anchor.lat, anchor.lng, z);
  var nc = unproject(ac.x - (sx - w / 2), ac.y - (sy - h / 2), z);
  pinchView = { zoom: z, lat: nc.lat, lng: nc.lng };
  redraw();
}

// زرار «الرحلة»: نرجع للمنظر اللي بيعرض المسار كله.
function fitRide() {
  mapState = null;
  pinchView = null;
  redraw();
}

// زرار واحد بمقاس الصباع (المقاس نفسه في `SHARE_CSS`).
function mapButton(label, title, disabled, onClick, wide) {
  var b = el('button', wide ? 'wide' : null, label);
  b.setAttribute('type', 'button');
  b.setAttribute('aria-label', title);
  b.setAttribute('title', title);
  if (disabled) b.disabled = true;
  b.addEventListener('click', function (e) {
    if (e && e.preventDefault) e.preventDefault();
    onClick();
  });
  return b;
}

function addControls(box) {
  var repo = mapRepo(box);
  // ⚠️ **مرة واحدة بس**: زمان كانت بتتعمل كل رسم والمسح في `redraw` كان بيشيل
  // القديمة؛ دلوقتي مفيش مسح، فإعادة البناء كانت هتكدّس شرايط فوق بعض.
  if (!repo.ctl) {
    var wrap = el('div', 'ctl');
    wrap.appendChild(mapButton('＋', 'تكبير الخريطة', false,
                               function () { zoomBy(1); }));
    wrap.appendChild(mapButton('−', 'تصغير الخريطة', false,
                               function () { zoomBy(-1); }));
    // «الرحلة» = إرجاع المنظر التلقائي (المسار كله). اسمه بالعربي ده عشان
    // الأهالي — «ريست» أو سهم لفة مش مفهوم.
    wrap.appendChild(mapButton('الرحلة', 'شوف الرحلة كلها على الخريطة', false,
                               function () { fitRide(); }, true));
    box.appendChild(wrap);
    repo.ctl = wrap;
  }
  var z = shownZoom();
  repo.ctl.children[0].disabled = z >= MAX_ZOOM;
  repo.ctl.children[1].disabled = z <= MIN_ZOOM;
}

// القرصة بالإصبعين بقت **بتاعتنا**:
//   • `touch-action: pan-y` في الـCSS (شوف `SHARE_CSS`) = المتصفح مش هيزوّم
//     الصفحة بالقرصة على الخريطة، وفي نفس الوقت السحب بإصبع واحد **فاضل**
//     بيسحب الصفحة (مهم: الخريطة نص الشاشة، ولو الصفحة اتجمّدت في إيد
//     الأهالي هيفتكروا الموقع باظ).
//   • وبنمنع السلوك الافتراضي بنفسنا كمان (`preventDefault` + `{passive:false}`)
//     لأن `touch-action` مش مضمون على كل المتصفحات القديمة اللي جوه موبايلات
//     الأهالي.
// ⚠️ **مفيش `user-scalable=no`** في الـ`viewport` عن قصد: تكبير **نص** الصفحة
// لازم يفضل شغّال (الأهالي بيقروا على موبايل صغير). اللي اتقفل هو القرصة على
// **الخريطة** بس.
function bindGestures(box) {
  if (box.__gestures) return;   // الصندوق الواحد بيتظبّط مرة
  box.__gestures = true;

  var pinch = null;   // {dist, zoom} — قرصة شغّالة دلوقتي؟

  function touchDist(t) {
    var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx * dx + dy * dy) || 1;
  }
  function touchMid(t) {
    return { x: (t[0].clientX + t[1].clientX) / 2,
             y: (t[0].clientY + t[1].clientY) / 2 };
  }
  // إحداثيات الصباع **جوه** صندوق الخريطة (المسافة من حدوده).
  function local(p) {
    var r = box.getBoundingClientRect ? box.getBoundingClientRect() : null;
    return { x: p.x - (r ? r.left : 0), y: p.y - (r ? r.top : 0) };
  }
  function stop(e) { if (e && e.preventDefault) e.preventDefault(); }

  box.addEventListener('touchstart', function (e) {
    if (!e.touches || e.touches.length !== 2) return;
    pinch = { dist: touchDist(e.touches), zoom: shownZoom() };
    stop(e);
  }, { passive: false });

  box.addEventListener('touchmove', function (e) {
    if (!pinch || !e.touches || e.touches.length !== 2) return;
    var p = local(touchMid(e.touches));
    stop(e);
    // نسبة المسافة بين الصباعين = نسبة التكبير (بمقياس لوغاريتمي).
    var z = pinch.zoom + Math.log(touchDist(e.touches) / pinch.dist) / Math.LN2;
    // ⚠️ **بوابة على الحركات الصغيرة**: كل إعادة رسم بتبني البلاطات والخط من
    // الأول، و`touchmove` بتنطلق عشرات المرات في الثانية — من غير البوابة دي
    // الإصبع بيحس بتقطيع على موبايل ضعيف. ٠٫٠٣ تكبير ≈ ٢٪ تغيير = مش باين للعين.
    if (Math.abs(z - shownZoom()) < 0.03) return;
    zoomAt(z, p.x, p.y);
  }, { passive: false });

  function endPinch() {
    if (pinch) {
      pinch = null;
      // الصباع اترفع: التكبير اللي اختاره المستخدم **يتثبّت**، والمركز يرجع على
      // العربية — عشان الكابتن ما يخرجش من الشاشة وهو ماشي (صفحة الأهل هدفها
      // تشوف العربية، مش تتفقّد خريطة).
      if (pinchView) {
        mapState = { zoom: pinchView.zoom };
        pinchView = null;
        redraw();
      }
    }
    // ولو كان فيه تحديث مستنّي القرصة تخلص (شوف `tick`) — يتنفّذ فورًا.
    if (pendingRefresh) { pendingRefresh = false; tick(); }
  }
  box.addEventListener('touchend', endPinch);
  box.addEventListener('touchcancel', endPinch);

  // تراك-باد/عجلة الماوس — بعض الأهالي بيفتحوا اللينك على اللابتوب.
  box.addEventListener('wheel', function (e) {
    stop(e);
    zoomBy((e.deltaY || 0) < 0 ? 1 : -1);
  }, { passive: false });
}

// ⚠️ **عُقد الخريطة بتتخزّن على الصندوق نفسه وبتتعاد استخدامها** — مفيش عقدة
// بتتشال من الشجرة أبدًا (السبب مشروح بالقياس في `redraw`، والنقطة المهمة:
// المتصفح بيقطع اللمس لما العقدة اللي اللمسة بدأت عليها تتشال).
// كل صندوق جديد (التحديث الدوري بيبني كارت جديد كل ١٥ ثانية) بيبدأ بذخيرة فاضية.
function mapRepo(box) {
  if (!box.__repo) {
    box.__repo = { tiles: [], svg: null, lines: [], pin: null, credit: null, ctl: null };
  }
  return box.__repo;
}

// بلاطات OpenStreetMap بحساب الإحداثيات — من غير أي مكتبة.
//
// [driver] = {lat, lng} مكان العربية (الماركر)، و[trail] = مقاطع المسار.
function drawMap(box, driver, trail, zoom) {
  var w = box.clientWidth, h = box.clientHeight;
  if (!w || !h) return;
  var segs = normTrail(trail);

  // ── مين اللي بيحدّد المنظر؟ ────────────────────────────────────────
  // قرصة شغّالة دلوقتي ← منظر القرصة · المستخدم اختار تكبير ← نفس التكبير
  // والمركز **على العربية** · غير كده ← تلقائي على المسار كله.
  var st;
  if (pinchView) {
    st = pinchView;
  } else if (mapState) {
    st = { zoom: mapState.zoom, lat: driver.lat, lng: driver.lng };
  } else if (segs.length) {
    st = fitView(segs, driver.lat, driver.lng, w, h, zoom);
  } else {
    st = { zoom: zoom, lat: driver.lat, lng: driver.lng };
  }

  // ⚠️ **التكبير بقى ممكن يبقى كسري** (القرصة بتطلّع ١٦٫٤ مثلًا)، وبلاطات
  // OSM موجودة بتكبير **صحيح** بس. فبنطلب بلاطات أقرب تكبير صحيح (`zt`)
  // وبنغيّر مقاسها (`size`) — من غير كده البلاطة تترسم بمقاسها الثابت والخط
  // يمشي جنب الشارع.
  var zt = Math.round(st.zoom);
  var size = TILE * Math.pow(2, st.zoom - zt);
  var scale = Math.pow(2, zt);
  var centre = worldPx(st.lat, st.lng, st.zoom);
  var ox = w / 2 - centre.x, oy = h / 2 - centre.y;   // بكسل العالم (٠٫٠) على الشاشة
  var c0 = Math.floor((0 - ox) / size), c1 = Math.floor((w - ox) / size);
  var r0 = Math.floor((0 - oy) / size), r1 = Math.floor((h - oy) / size);
  var repo = mapRepo(box);
  var used = 0;
  for (var c = c0; c <= c1; c++) {
    for (var r = r0; r <= r1; r++) {
      if (c < 0 || r < 0 || c >= scale || r >= scale) continue;
      var src = 'https://tile.openstreetmap.org/' + zt + '/' + c + '/' + r + '.png';
      var img = repo.tiles[used];
      if (!img) {
        img = document.createElement('img');
        img.alt = '';
        img.loading = 'lazy';
        box.appendChild(img);
        repo.tiles[used] = img;
      }
      // `__src` بدل `img.src`: الرابط بيتكتب مرة واحدة للبلاطة الواحدة، فالتكبير
      // اللي بيرجّع بلاطة موجودة **ما بيعملش تحميل تاني** (ومفيش رَمَش أبيض).
      if (img.__src !== src) { img.src = src; img.__src = src; }
      img.style.left = (ox + c * size) + 'px';
      img.style.top = (oy + r * size) + 'px';
      img.style.width = size + 'px';
      img.style.height = size + 'px';
      img.style.display = '';
      used++;
    }
  }
  // البلاطات الزيادة (التكبير لفوق محتاج أقل) بتتخبّى **مش بتتشال**.
  for (var rest = used; rest < repo.tiles.length; rest++) repo.tiles[rest].style.display = 'none';

  // ── المسار فوق البلاطات ────────────────────────────────────────────
  if (segs.length) {
    var NS = 'http://www.w3.org/2000/svg';
    var svg = repo.svg;
    if (!svg) {
      svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'trail');
      box.appendChild(svg);
      repo.svg = svg;
    }
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    var layers = ['casing', 'line'];
    var drawn = 0;
    for (var li = 0; li < layers.length; li++) {
      for (var s2 = 0; s2 < segs.length; s2++) {
        var coords = [];
        for (var k = 0; k < segs[s2].length; k++) {
          var q = worldPx(segs[s2][k][0], segs[s2][k][1], st.zoom);
          coords.push((ox + q.x) + ',' + (oy + q.y));
        }
        var ln = repo.lines[drawn];
        if (!ln) {
          ln = document.createElementNS(NS, 'polyline');
          svg.appendChild(ln);
          repo.lines[drawn] = ln;
        }
        ln.setAttribute('class', layers[li]);
        ln.setAttribute('points', coords.join(' '));
        ln.style.display = '';
        drawn++;
      }
    }
    for (var lrest = drawn; lrest < repo.lines.length; lrest++) {
      repo.lines[lrest].style.display = 'none';
    }
  }

  // الماركر بيتحط في **مكانه على الخريطة** بالحساب، مش في نص الشاشة.
  // ⚠️ كان `left:50%; top:50%` (نص الصندوق) — وده كان صح لما الخريطة كانت
  // متمركزة على العربية. دلوقتي المركز ممكن يبقى منتصف المسار، فالماركر
  // الثابت في النص بيقف في مكان الكابتن **مش** فيه — ومكان غلط بيبان صح
  // أخطر حاجة عندنا.
  var dp = worldPx(driver.lat, driver.lng, st.zoom);
  var pin = repo.pin;
  if (!pin) {
    pin = el('div', 'pin');
    box.appendChild(pin);
    repo.pin = pin;
  }
  pin.style.left = (ox + dp.x) + 'px';
  pin.style.top = (oy + dp.y) + 'px';

  // سطر حقوق OpenStreetMap — **مرة واحدة** (وده الرابط الوحيد اللي ممكن الصباع
  // يبدأ عليه فوق الخريطة، فلو اتشال وسط القرصة اللمسة تتقطع زي البلاطة).
  if (!repo.credit) {
    var credit = el('div', 'osm');
    var a = document.createElement('a');
    a.href = 'https://www.openstreetmap.org/copyright';
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '© OpenStreetMap';
    credit.appendChild(a);
    box.appendChild(credit);
    repo.credit = credit;
  }

  // الأزرار بتتعمل جوه `addControls` **مرة واحدة** كمان (عن طريق نفس الذخيرة)،
  // واللي بيتغيّر كل رسم حالة التعطيل عند السقفين بس.
  addControls(box);
  bindGestures(box);

  // نحفظ اللي اترسم — الأزرار والقرصة بتشتغل من هنا (و`mapState` بره الشجرة
  // فالتحديث الدوري مش بيمسحها).
  lastMap = { box: box, driver: driver, segs: segs, start: zoom, state: st };
}

function ageText(seconds) {
  if (seconds === null || seconds === undefined) return '';
  if (seconds < 20) return 'المكان متحدّث دلوقتي';
  if (seconds < 60) return 'آخر تحديث للمكان قبل ' + seconds + ' ثانية';
  var m = Math.round(seconds / 60);
  return 'آخر تحديث للمكان قبل ' + m + ' دقيقة';
}

function renderLive(data) {
  var d = data.driver || {};
  var map = null;
  clear();
  var box = el('div', 'card');

  var st = el('div', 'status' + (d.online ? '' : ' off'),
              LABELS[data.status] || 'الرحلة شغالة');
  box.appendChild(st);

  var name = el('h1', null, d.first_name ? ('الكابتن ' + d.first_name) : 'الكابتن');
  box.appendChild(name);

  if (d.plate) {
    var row = el('div', 'kv');
    row.appendChild(el('span', 'k', 'اللوحة'));
    row.appendChild(el('span', 'v', d.plate));
    box.appendChild(row);
  }
  if (d.color) {
    var row2 = el('div', 'kv');
    row2.appendChild(el('span', 'k', 'اللون'));
    row2.appendChild(el('span', 'v', d.color));
    box.appendChild(row2);
  }

  if (d.online && d.lat !== null && d.lat !== undefined &&
      d.lng !== null && d.lng !== undefined) {
    map = el('div', 'map');
    box.appendChild(map);
    var open = document.createElement('a');
    open.className = 'btn';
    open.href = mapLink(d.lat, d.lng);
    open.target = '_blank';
    open.rel = 'noopener';
    open.textContent = 'افتح المكان على جوجل مابس';
    box.appendChild(open);
  } else {
    box.appendChild(el('p', 'big', 'العربية مش بتحدّث مكانها دلوقتي'));
    box.appendChild(el('p', 'muted',
      'يعني تطبيق الكابتن مقفول أو الشبكة عنده واقفة. اسأل صاحب الرحلة ' +
      'يطمّنك، والصفحة هتحدّث لوحدها أول ما يرجع.'));
  }

  var age = el('p', 'muted', ageText(data.__age));
  box.appendChild(age);
  box.appendChild(el('p', 'muted',
    'الصفحة بتحدّث لوحدها كل ١٥ ثانية. وفيها مكان العربية واسم الكابتن ' +
    'بس — مفيش اسم العميل ولا تليفونه ولا عنوانه.'));
  root.appendChild(box);

  // ⚠️ الرسم **بعد** ما الكارت يتضاف للصفحة، مش قبله: العنصر اللي لسه في
  // الذاكرة (مش في الـ DOM) مقاسه صفر، و`drawMap` بتقيس `clientWidth` —
  // فلو ناداها بدري بترجع من غير ما ترسم حاجة، والخريطة تطلع مستطيل فاضي.
  //
  // و`data.trail` هي **مسار الرحلة** المسجّل (ميجريشن ٠٠٦٣) — نفس الشكل اللي
  // الكابتن ماشي بيه على شاشة العميل، والصفحة بترسمه وراه.
  if (map) drawMap(map, { lat: d.lat, lng: d.lng }, data.trail, 16);
}

function render(data) {
  if (!data || data.state === 'unknown') {
    if (lastData) return;   // عندنا كارت شغّال — مانكسروش بسبب رد غريب
    showMessage('اللينك ده مش شغّال', [
      { text: 'ممكن الرحلة تكون خلصت، أو صاحب الرحلة قفل اللينك، أو ' +
              'اللينك اتنسخ ناقص. اتكلّم على صاحب الرحلة وهو يبعتلك لينك جديد.' },
      { text: 'مفيش أي بيانات شخصية بتظهر على الصفحة دي في كل الحالات.',
        muted: true },
    ], reloadButton());
    stop();
    return;
  }
  if (data.state === 'finished') {
    showMessage('الرحلة خلصت', [
      { text: 'الحمد لله، العربية وصلت. خلاص مفيش مكان بيتعرض بعد وصول ' +
              'الرحلة — ده مقصود عشان محدش يفضل يشوف حد وهو واقف.' },
    ]);
    stop();
    return;
  }
  renderLive(data);
}

function stop() { if (timer) { clearInterval(timer); timer = null; } }

function tick() {
  // ⚠️ **ممنوع نعيد بناء الكارت وإحنا وسط قرصة على الخريطة**: إعادة البناء بتشيل
  // **صندوق الخريطة نفسه** من الصفحة، والمتصفح بيقطع سلسلة اللمس لما العقدة اللي
  // اللمسة بدأت عليها تتشال (نفس عطل `redraw` بالظبط — مقيس، شوف التعليق هناك).
  // فبنأجّل التحديث للدورة اللي بعدها، و`endPinch` بتنده `tick` أول ما الصباع
  // يترفع — يعني الصفحة مش بتفضل قديمة.
  if (pinchView) { pendingRefresh = true; return; }
  var box = document.getElementById('net');
  if (box) box.remove();
  fetch(SUPABASE_URL + '/rest/v1/rpc/shared_ride', {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ p_token: token })
  }).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function (data) {
    // ⚠️ العمر بيتحسب من **وقت السيرفر** (`server_time` ناقص `updated_at`)
    // مش من ساعة الموبايل: ساعة موبايل مضبوطة غلط كانت هتقول «متحدّث» وهي
    // واقفة من عشر دقايق، أو العكس.
    if (data && data.driver && data.driver.updated_at && data.server_time) {
      data.__age = Math.max(0, Math.round(
        (new Date(data.server_time) - new Date(data.driver.updated_at)) / 1000));
    }
    if (data && data.state !== 'unknown') lastData = data;
    render(data);
  }).catch(function () {
    if (lastData) {
      // عندنا كارت شغّال — منكسرش الشكل بسبب انقطاع شبكة لحظي، بس لازم
      // نقول إن الرقم اللي فوق **مش لايف** (نفس منطق نبضة الأونلاين).
      if (!document.getElementById('net')) {
        var w = el('div', 'warn',
          'الشبكة عندك واقفة دلوقتي — اللي تحت آخر حاجة عرفناها. ' +
          'هنكرر لوحدنا.');
        w.id = 'net';
        root.insertBefore(w, root.firstChild);
      }
      return;
    }
    showMessage('مش قادرين نوصل بالنت', [
      { text: 'اتأكد إن النت شغّال على موبايلك وجرّب تاني.' },
    ], reloadButton());
  });
}

function start() {
  if (!tokenOk) {
    showMessage('مفيش رحلة في اللينك', [
      { text: 'اللينك لازم يكون فيه كود الرحلة بعد علامة الاستفهام. ' +
              'اطلب من صاحب الرحلة يبعتلك اللينك كامل.' },
    ], reloadButton());
    return;
  }
  tick();
  timer = setInterval(tick, REFRESH_MS);
  // رجوع الصفحة للمقدمة = لحظة طبيعية للتحديث (الموبايل كان مقفول أو في
  // تطبيق تاني)، وإلا العيلة تقعد تستنى لحد الدورة الجاية.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && timer) tick();
  });
}

start();
</script>
</body>
